# Fly.io — `fly launch --no-deploy` then `fly deploy`.
#
# auto_stop_machines / auto_start_machines keep a personal relay inside the free
# allowance: the machine sleeps when nobody is connected and wakes on the next request.
app = "geardrop"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 400
    soft_limit = 250

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  timeout = "3s"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
